<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAM DIGITAL - MACRO GAME</title>
    <link rel="icon" type="image/png" href="/assets/Logo_BAM_Transparant.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-category-id="macro-game">
    <nav id="site-nav" class="site-nav"></nav>

    <main class="page">
        <section class="category-hero">
            <div class="hero-main">
                <div class="eyebrow" id="hero-eyebrow"></div>
                <h1 id="hero-title"></h1>
                <p class="hero-description" id="hero-description"></p>
                <div class="hero-actions">
                    <a class="btn-primary" href="#produk"><i class="fa-solid fa-box-open"></i> Lihat Produk</a>
                    <button class="btn-ghost" type="button" data-open-contact>Hubungi Admin</button>
                </div>
                <div class="hero-stats" id="hero-stats"></div>
            </div>
            <div class="hero-side-stack" id="category-info"></div>
        </section>

        <section id="produk" class="section">
            <div class="product-grid" id="product-list"></div>
        </section>
    </main>

    <footer>BAM DIGITAL - Macro Game</footer>
    <div id="global-modals"></div>
    <div id="product-modal-overlay" class="modal-overlay">
        <div id="product-modal" class="product-modal"></div>
    </div>

    <script src="/config.js"></script>
    <script src="/common.js"></script>
    <script src="/category-page.js"></script>
</body>
</html>
